services:
  - type: web
    name: bpsc-nexus-miniapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python miniapp.py
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
